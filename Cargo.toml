[workspace]
resolver = "3"
members = [
    "deboa-tokio",
    "deboa-test-utils",
]

[workspace.package]
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/deboa-tokio"
homepage = "https://github.com/ararog/deboa"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"

[workspace.dependencies]
async-executor = { version = "1.13.3", default-features = false }
async-lock = "3.4.2"
base64 = { version = "0.23.1" }
bytes = { version = "1.11" }
caramelo = "0.1.4"
cookie = { version = "0.18.1" }
deboa = { path = "../deboa/deboa" }
#deboa = { version = "0.1.5-beta.2" }
deboa-extras = { path = "../deboa-contrib/deboa-extras" }
#deboa-extras = { version = "0.1.1-beta.2" }
deboa-fory = { path = "../deboa-contrib/deboa-fory" }
deboa-macros = { path = "../deboa/deboa-macros" }
#deboa-macros = { version = "0.1.0-beta.7" }
deboa-test-utils = { path = "deboa-test-utils" }
env_logger = "0.11.11"
futures-util = { version = "0.3.31", default-features = false }
hashbrown = "0.17.1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.8.1", features = ["client"], default-features = false }
hyper-body-utils = { version = "0.1.17", default-features = false }
hyper-util = { version = "0.1.20", features = [
  "client",
  "client-legacy",
], default-features = false }
multer = "3.1.0"
rand = "0.10.2"
rstest = "0.27.0"
serde = { version = "1.0.217", features = ["derive"] }
tackle = { version = "0.1.1"}
url = "2.5.8"
vamo = { path = "../vamo/vamo" }
#vamo = { version = "0.1.2-beta.2" }
vamo-macros = { path = "../vamo/vamo-macros" }
#vamo-macros = { version = "0.1.2-beta.2" }

[profile.test]
lto = false

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

#[patch.crates-io]
#deboa = { path = "../deboa/deboa" }
