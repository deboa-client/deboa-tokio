[package]
name = "deboa-tokio"
version = "0.1.4-beta.1"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/ararog/deboa"
description = "A friendly rest client on top of hyper."
readme = "../README.md"
license.workspace = true
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
features = [
  "http1",
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
]

[features]
default = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
  "websockets"
]

# tls
rust-tls = [
  "rustls/tls12",
  "dep:rustls-native-certs",
  "dep:tokio-rustls",
  "dep:rustls-pki-types",
]

# rustls verifiers
webpki-rustls-verifier = ["__webpki_rustls_verifier"]
platform-rustls-verifier = ["__platform_rustls_verifier"]

default-rustls-verifier = ["__webpki_rustls_verifier"]
__webpki_rustls_verifier = ["dep:webpki-roots"]
__platform_rustls_verifier = ["dep:rustls-platform-verifier"]

# rustls providers
no-provider = []
aws-lc-rustls-provider = ["__rustls_aws_lc_rs"]
ring-rustls-provider = ["__rustls_ring"]

default-rustls-provider = ["__rustls_aws_lc_rs"]
__rustls_aws_lc_rs = ["rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs"]
__rustls_ring = ["rustls/ring", "quinn/rustls-ring"]

# native-tls implementations
native-tls = ["async-native-tls/runtime-tokio"]

# protocols
http1 = ["rustls/tls12", "hyper/http1", "hyper-util/http1"]
http2 = ["rustls/tls12", "hyper/http2", "hyper-util/http2"]
http3 = [
  "deboa-h3/generic",
  "dep:futures",
  "dep:h3",
  "dep:h3-quinn",
  "quinn/runtime-tokio",
  "hyper-body-utils/generic",
  "hyper-body-utils/generic-h3",
]

websockets = ["deboa-ws/tokio"]

[dependencies]
async-executor = { version = "1.13.3", default-features = false }
async-lock = "3.4.2"
async-native-tls = { version = "0.6.0", optional = true, default-features = false }
base64 = { version = "0.23.0" }
bytes.workspace = true
cookie = { version = "0.18.1" }
deboa.workspace = true
deboa-h3 = { version = "0.1.3-beta.1", optional = true }
deboa-tls = { version = "0.1.0-beta.2" }
deboa-ws =  { version = "0.1.0-beta.2", optional = true }
env_logger.workspace = true
futures = { version = "0.3.31", optional = true, default-features = false }
futures-util = { workspace = true, default-features = false }
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true , default-features = false }
hashbrown = "0.17.1"
http.workspace = true
http-body = "1"
http-body-util = { workspace = true }
hyper = { version = "1.10.1", features = ["client"], default-features = false }
hyper-body-utils = { version = ">= 0.1.14", default-features = false }
hyper-util = { version = "0.1.20", features = [
    "client",
    "client-legacy",
], default-features = false }
indexmap = "2.11.4"
log = "0.4.34"
minimime = "1.0.0"
quinn = { version = "0.11.7", optional = true, features = [
  "runtime-tokio",
], default-features = false }
rand = { workspace = true }
regex = "1.9.6"
rustls = { version = "0.23.36", optional = true, default-features = false }
rustls-native-certs = { version = "0.8.0", optional = true, default-features = false }
rustls-pki-types = { version = "1.13.2", optional = true, default-features = false }
rustls-platform-verifier = { version = "0.7.0", optional = true, default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
tokio = { version = "1.53.1", features = [
  "macros",
  "fs",
  "time",
], default-features = false }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false }
tokio-util = { version = "0.7.11", features = ["io"], default-features = false }
url.workspace = true
urlencoding = "2.1.3"
webpki-roots = { version = "1.0.6", optional = true, default-features = false }

[dev-dependencies]
caramelo.workspace = true
criterion = { version = "0.8.2", features = [
  "html_reports",
  "async",
  "async_tokio",
] }
deboa-test-utils = { workspace = true }
easyhttpmock-vetis-tokio = { version = "0.1.1", features = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
], default-features = false }
futures-util = { version = "0.3.31", default-features = false }
multer = "3.1.0"
rstest.workspace = true
tokio = { version = "1.53.1", features = [
  "macros",
  "fs",
  "net",
], default-features = false }
