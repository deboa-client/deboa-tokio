[package]
name = "deboa-tokio"
version = "0.1.4-beta.8"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/ararog/deboa"
description = "A friendly rest client on top of hyper."
readme = "../README.md"
license.workspace = true
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version.workspace = true

[package.metadata.cargo-machete]
ignored = ["deboa-ws", "hyper-util", "rustls-native-certs"]

[package.metadata.docs.rs]
features = [
  "http2",
  "http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
]

[features]
default = [
  #"http2",
  #"http3",
  #"native-tls",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
  "websockets"
]

cookies = ["deboa/cookie"]
multipart = ["deboa-multipart/multi-threaded"]

# tls
rust-tls = [
  "rustls/tls12",
  "dep:rustls-native-certs",
  "dep:tokio-rustls",
  "dep:rustls-pki-types",
]

# rustls verifiers
webpki-rustls-verifier = ["__webpki_rustls_verifier"]
platform-rustls-verifier = ["__platform_rustls_verifier"]

default-rustls-verifier = ["__webpki_rustls_verifier"]
__webpki_rustls_verifier = ["dep:webpki-roots"]
__platform_rustls_verifier = ["dep:rustls-platform-verifier"]

# rustls providers
no-provider = []
aws-lc-rustls-provider = ["__rustls_aws_lc_rs"]
ring-rustls-provider = ["__rustls_ring"]

default-rustls-provider = ["__rustls_aws_lc_rs"]
__rustls_aws_lc_rs = ["rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs"]
__rustls_ring = ["rustls/ring", "quinn/rustls-ring"]

# native-tls implementations
native-tls = ["async-native-tls-ext/runtime-tokio"]

# protocols
http2 = ["hyper/http2", "hyper-util/http2"]
http3 = [
  "dep:deboa-h3",
  "dep:futures",
  "dep:h3",
  "dep:h3-quinn",
  "quinn/runtime-tokio",
  "hyper-body-utils/h3",
]

websockets = ["deboa-ws/runtime-tokio"]

[dependencies]
async-native-tls-ext = { version = "0.6.0", optional = true, default-features = false }
deboa.workspace = true
deboa-h3 = { version = "0.1.3-beta.3", optional = true }
deboa-multipart = { version = "0.1.0-beta.1" }
deboa-tls = { version = "0.1.0-beta.5" }
deboa-ws =  { version = "0.1.0-beta.5", optional = true }
futures = { version = "0.3.31", optional = true, default-features = false }
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true , default-features = false }
hashbrown = "0.17.1"
http.workspace = true
hyper = { workspace = true, features = ["client", "http1"], default-features = false }
hyper-body-utils.workspace = true
hyper-util.workspace = true
log = "0.4.34"
quinn = { version = "0.11.12", optional = true, features = [
  "runtime-tokio",
], default-features = false }
rand = { workspace = true }
rustls = { version = "0.23.46", optional = true, default-features = false }
rustls-native-certs = { version = "0.8.0", optional = true, default-features = false }
rustls-pki-types = { version = "1.13.2", optional = true, default-features = false }
rustls-platform-verifier = { version = "0.7.0", optional = true, default-features = false }
tokio = { version = "1.53.3", features = [
  "macros",
  "fs",
  "time",
], default-features = false }
tokio-rustls = { version = "0.26.5", optional = true, default-features = false }
webpki-roots = { version = "1.0.6", optional = true, default-features = false }

[dev-dependencies]
bytes.workspace = true
caramelo.workspace = true
deboa-multipart = { version = "0.1.0-beta.1" }
deboa-test-utils = { workspace = true }
easyhttpmock-vetis-tokio = { version = "0.1.2-beta.5", features = [
  "http2",
  "http3",
  "rust-tls",
], default-features = false }
futures-util = { version = "0.3.31", default-features = false }
rstest.workspace = true
tokio = { version = "1.53.1", features = [
  "macros",
  "fs",
  "net",
], default-features = false }
tokio-util = { version = "0.7.20", features = ["io"], default-features = false }
